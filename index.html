<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Labs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .labs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .lab {
            display: block;
            background: white;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-decoration: none;
            color: #222;
        }

        .lab:hover {
            background: #fafafa;
            border-color: #999;
        }

        .lab h2 {
            margin: 0 0 8px 0;
        }

        .lab p {
            margin: 0;
            color: #666;
        }

        @media (max-width: 600px) {
            .labs {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Labs</h1>
    <p class="subtitle">Lab assignments and projects</p>

    <div class="labs">

        <a class="lab" href="lab1.html">
            <h2>Lab 1</h2>
            <p>View Lab 1</p>
        </a>

        <a class="lab" href="lab2.html">

        </a>

        <a class="lab" href="lab3.html">

        </a>

        <a class="lab" href="lab4.html">
            <h2>Lab 4</h2>
            <p>View Lab 4</p>
        </a>

        <a class="lab" href="lab5.html">
            <h2>Lab 5</h2>
            <p>View Lab 5</p>
        </a>

        <a class="lab" href="lab6.html">
            <h2>Lab 6</h2>
            <p>View Lab 6</p>
        </a>

        <a class="lab" href="lab7.html">
            <h2>Lab 7</h2>
            <p>View Lab 7</p>
        </a>

    </div>

</body>
</html>
